<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 256" role="img" aria-label="Animated revenue protection shield">
  <defs>
    <linearGradient id="rsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1016"/>
      <stop offset="100%" stop-color="#141D26"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#BEC8D2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#BEC8D2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="520" height="256" rx="14" fill="url(#rsBg)"/>
  <circle cx="260" cy="122" r="88" fill="url(#pulse)">
    <animate attributeName="r" values="70;96;70" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <path d="M260 42 L332 68 V118 C332 168 300 196 260 214 C220 196 188 168 188 118 V68 Z"
        fill="#121A22" stroke="#BEC8D2" stroke-width="2.2"/>
  <path d="M260 62 L312 80 V118 C312 156 288 178 260 192 C232 178 208 156 208 118 V80 Z"
        fill="#1A2530" stroke="#8FA0AD" stroke-width="1.2"/>
  <path d="M236 124 L252 140 L288 100" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,80;80,0" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, sans-serif" font-size="11">
    <rect x="28" y="46" width="118" height="36" rx="8" fill="#1A2530" stroke="#5E7384"/>
    <text x="87" y="68" text-anchor="middle" fill="#E8EDF2">Unbilled items</text>
    <line x1="146" y1="64" x2="198" y2="96" stroke="#7A8A98" stroke-width="1.2" stroke-dasharray="4 3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </line>

    <rect x="28" y="178" width="118" height="36" rx="8" fill="#1A2530" stroke="#5E7384"/>
    <text x="87" y="200" text-anchor="middle" fill="#E8EDF2">Duplicate pay</text>
    <line x1="146" y1="196" x2="198" y2="150" stroke="#7A8A98" stroke-width="1.2" stroke-dasharray="4 3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </line>

    <rect x="374" y="46" width="118" height="36" rx="8" fill="#1A2530" stroke="#5E7384"/>
    <text x="433" y="68" text-anchor="middle" fill="#E8EDF2">Compliance</text>
    <line x1="374" y1="64" x2="322" y2="96" stroke="#7A8A98" stroke-width="1.2" stroke-dasharray="4 3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.3s" repeatCount="indefinite"/>
    </line>

    <rect x="374" y="178" width="118" height="36" rx="8" fill="#1A2530" stroke="#BEC8D2"/>
    <text x="433" y="200" text-anchor="middle" fill="#E8EDF2">Audit locked</text>
    <line x1="374" y1="196" x2="322" y2="150" stroke="#BEC8D2" stroke-width="1.2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
