<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="LedgerIQ system architecture">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1016"/>
      <stop offset="55%" stop-color="#141D26"/>
      <stop offset="100%" stop-color="#090F15"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BEC8D2"/>
      <stop offset="100%" stop-color="#7A8A98"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="920" height="520" rx="24" fill="url(#bg)"/>
  <ellipse cx="460" cy="430" rx="320" ry="42" fill="#000" opacity="0.35"/>
  <text x="460" y="48" text-anchor="middle" fill="#E8EDF2" font-family="Georgia, serif" font-size="28" font-weight="600">LedgerIQ Architecture</text>
  <text x="460" y="72" text-anchor="middle" fill="#8FA0AD" font-family="Segoe UI, sans-serif" font-size="13">Agentic B2B Financial Reconciliation Platform</text>

  <!-- Frontend layer -->
  <g transform="translate(70,110)">
    <polygon points="0,40 120,0 240,40 120,80" fill="#1A2530" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="0,40 0,110 120,150 120,80" fill="#121A22" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="120,80 120,150 240,110 240,40" fill="url(#glass)" stroke="#8FA0AD" stroke-width="1.5"/>
    <text x="120" y="92" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Next.js 14</text>
    <text x="120" y="112" text-anchor="middle" fill="#A8B6C2" font-family="Segoe UI, sans-serif" font-size="11">App Router · React Query</text>
  </g>

  <!-- API layer -->
  <g transform="translate(340,130)">
    <polygon points="0,40 120,0 240,40 120,80" fill="#1A2530" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="0,40 0,110 120,150 120,80" fill="#121A22" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="120,80 120,150 240,110 240,40" fill="url(#glass)" stroke="#8FA0AD" stroke-width="1.5"/>
    <text x="120" y="92" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">FastAPI</text>
    <text x="120" y="112" text-anchor="middle" fill="#A8B6C2" font-family="Segoe UI, sans-serif" font-size="11">JWT · RBAC · REST</text>
  </g>

  <!-- Agents layer -->
  <g transform="translate(610,110)" filter="url(#glow)">
    <polygon points="0,40 120,0 240,40 120,80" fill="#1A2530" stroke="#BEC8D2" stroke-width="1.8"/>
    <polygon points="0,40 0,110 120,150 120,80" fill="#121A22" stroke="#BEC8D2" stroke-width="1.8"/>
    <polygon points="120,80 120,150 240,110 240,40" fill="url(#glass)" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="120" y="88" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Gemini ADK</text>
    <text x="120" y="108" text-anchor="middle" fill="#A8B6C2" font-family="Segoe UI, sans-serif" font-size="11">Multi-agent pipeline</text>
  </g>

  <!-- MongoDB -->
  <g transform="translate(180,300)">
    <polygon points="0,40 100,0 200,40 100,80" fill="#1A2530" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="0,40 0,95 100,135 100,80" fill="#121A22" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="100,80 100,135 200,95 200,40" fill="url(#glass)" stroke="#8FA0AD" stroke-width="1.5"/>
    <text x="100" y="86" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">MongoDB</text>
    <text x="100" y="104" text-anchor="middle" fill="#A8B6C2" font-family="Segoe UI, sans-serif" font-size="10">Motor · Atlas Vector</text>
  </g>

  <!-- MCP -->
  <g transform="translate(360,300)">
    <polygon points="0,40 100,0 200,40 100,80" fill="#1A2530" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="0,40 0,95 100,135 100,80" fill="#121A22" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="100,80 100,135 200,95 200,40" fill="url(#glass)" stroke="#8FA0AD" stroke-width="1.5"/>
    <text x="100" y="86" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">MCP Server</text>
    <text x="100" y="104" text-anchor="middle" fill="#A8B6C2" font-family="Segoe UI, sans-serif" font-size="10">/mcp/sse · allowlist</text>
  </g>

  <!-- ERP Agent -->
  <g transform="translate(540,300)">
    <polygon points="0,40 100,0 200,40 100,80" fill="#1A2530" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="0,40 0,95 100,135 100,80" fill="#121A22" stroke="#5E7384" stroke-width="1.5"/>
    <polygon points="100,80 100,135 200,95 200,40" fill="url(#glass)" stroke="#8FA0AD" stroke-width="1.5"/>
    <text x="100" y="86" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">ERP Agent</text>
    <text x="100" y="104" text-anchor="middle" fill="#A8B6C2" font-family="Segoe UI, sans-serif" font-size="10">Excel · SAP · CSV</text>
  </g>

  <!-- Connectors -->
  <path d="M190 190 L340 210" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
  <path d="M430 210 L610 190" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
  <path d="M430 260 L280 300" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>
  <path d="M460 260 L460 300" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>
  <path d="M490 260 L640 300" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>
  <path d="M730 190 L640 300" stroke="url(#accent)" stroke-width="2" opacity="0.45" stroke-dasharray="6 6"/>

  <rect x="40" y="450" width="840" height="44" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="460" y="477" text-anchor="middle" fill="#C9D4DD" font-family="Segoe UI, sans-serif" font-size="12">Deterministic matching · Human-in-the-loop approvals · Counterparty magic-link portal</text>
</svg>
