  <rect x="40" y="416" width="880" height="72" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="480" y="448" text-anchor="middle" fill="#C9D4DD" font-family="Segoe UI, sans-serif" font-size="13">Matching is a Python diff on transaction_ref. Gemini never invents the core numbers. SMTP fires only after approval.</text>
  <text x="480" y="470" text-anchor="middle" fill="#8FA0AD" font-family="Segoe UI, sans-serif" font-size="12">Agents call find/update through MCP  not a raw Mongo connection from the model.</text>
