<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="How LedgerIQ solves reconciliation">
  <rect width="960" height="280" rx="20" fill="#0A1016"/>
  <text x="480" y="36" text-anchor="middle" fill="#E8EDF2" font-family="Georgia, serif" font-size="22">How LedgerIQ solves it</text>
  <text x="480" y="58" text-anchor="middle" fill="#8FA0AD" font-family="Segoe UI, sans-serif" font-size="12">Deterministic match first. Gemini explains. Humans send mail.</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="28" y="88" width="160" height="130" rx="14" fill="#141D26" stroke="#5E7384"/>
    <text x="108" y="128" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">1. Import</text>
    <text x="108" y="152" text-anchor="middle" fill="#9AABB8" font-size="11">Master balances</text>
    <text x="108" y="170" text-anchor="middle" fill="#9AABB8" font-size="11">Internal + SOA files</text>

    <rect x="216" y="88" width="160" height="130" rx="14" fill="#141D26" stroke="#5E7384"/>
    <text x="296" y="128" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2. Match</text>
    <text x="296" y="152" text-anchor="middle" fill="#9AABB8" font-size="11">transaction_ref</text>
    <text x="296" y="170" text-anchor="middle" fill="#9AABB8" font-size="11">no guessed numbers</text>

    <rect x="404" y="88" width="160" height="130" rx="14" fill="#141D26" stroke="#BEC8D2"/>
    <text x="484" y="128" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">3. Analyze</text>
    <text x="484" y="152" text-anchor="middle" fill="#9AABB8" font-size="11">Gemini ADK agents</text>
    <text x="484" y="170" text-anchor="middle" fill="#9AABB8" font-size="11">classify + draft email</text>

    <rect x="592" y="88" width="160" height="130" rx="14" fill="#141D26" stroke="#5E7384"/>
    <text x="672" y="128" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">4. Approve</text>
    <text x="672" y="152" text-anchor="middle" fill="#9AABB8" font-size="11">awaiting_approval</text>
    <text x="672" y="170" text-anchor="middle" fill="#9AABB8" font-size="11">human in the loop</text>

    <rect x="780" y="88" width="152" height="130" rx="14" fill="#141D26" stroke="#5E7384"/>
    <text x="856" y="128" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">5. Send</text>
    <text x="856" y="152" text-anchor="middle" fill="#9AABB8" font-size="11">SMTP only after</text>
    <text x="856" y="170" text-anchor="middle" fill="#9AABB8" font-size="11">an operator clicks</text>
  </g>

  <path d="M188 153 H216" stroke="#BEC8D2" stroke-width="1.6"/>
  <path d="M376 153 H404" stroke="#BEC8D2" stroke-width="1.6"/>
  <path d="M564 153 H592" stroke="#BEC8D2" stroke-width="1.6"/>
  <path d="M752 153 H780" stroke="#BEC8D2" stroke-width="1.6"/>
</svg>
