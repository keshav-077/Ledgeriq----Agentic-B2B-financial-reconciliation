<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="LedgerIQ AWS deployment">
  <rect width="960" height="360" rx="20" fill="#0A1016"/>
  <text x="480" y="36" text-anchor="middle" fill="#E8EDF2" font-family="Georgia, serif" font-size="22">Deployment  single EC2 in ap-southeast-2</text>
  <text x="480" y="58" text-anchor="middle" fill="#8FA0AD" font-family="Segoe UI, sans-serif" font-size="12">Free-tier friendly Compose stack. Secrets live in SSM, not in git.</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="36" y="88" width="140" height="88" rx="12" fill="#141D26" stroke="#5E7384"/>
    <text x="106" y="124" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Browser</text>
    <text x="106" y="146" text-anchor="middle" fill="#9AABB8" font-size="11">http://EIP</text>

    <rect x="212" y="88" width="160" height="88" rx="12" fill="#141D26" stroke="#BEC8D2"/>
    <text x="292" y="124" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">nginx :80</text>
    <text x="292" y="146" text-anchor="middle" fill="#9AABB8" font-size="11">path router</text>

    <rect x="420" y="80" width="180" height="56" rx="10" fill="#141D26" stroke="#5E7384"/>
    <text x="510" y="114" text-anchor="middle" fill="#E8EDF2" font-size="13" font-weight="700">frontend :3000</text>

    <rect x="420" y="148" width="180" height="56" rx="10" fill="#141D26" stroke="#5E7384"/>
    <text x="510" y="182" text-anchor="middle" fill="#E8EDF2" font-size="13" font-weight="700">backend :8080</text>

    <rect x="420" y="216" width="180" height="56" rx="10" fill="#141D26" stroke="#5E7384"/>
    <text x="510" y="250" text-anchor="middle" fill="#E8EDF2" font-size="13" font-weight="700">mongo :27017</text>

    <rect x="660" y="88" width="264" height="184" rx="12" fill="#141D26" stroke="#5E7384"/>
    <text x="792" y="124" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">SSM parameters</text>
    <text x="792" y="152" text-anchor="middle" fill="#9AABB8" font-size="12">/ledgeriq/secret-key</text>
    <text x="792" y="176" text-anchor="middle" fill="#9AABB8" font-size="12">/ledgeriq/admin-password</text>
    <text x="792" y="200" text-anchor="middle" fill="#9AABB8" font-size="12">/ledgeriq/gemini-api-key</text>
    <text x="792" y="232" text-anchor="middle" fill="#5E7384" font-size="11">Injected into .env on boot</text>
  </g>

  <path d="M176 132 H212" stroke="#BEC8D2" stroke-width="1.6"/>
  <path d="M372 132 H420" stroke="#BEC8D2" stroke-width="1.6"/>
  <path d="M372 176 H420" stroke="#8FA0AD" stroke-width="1.4"/>
  <path d="M600 176 H660" stroke="#8FA0AD" stroke-width="1.4" stroke-dasharray="5 4"/>

  <text x="480" y="318" text-anchor="middle" fill="#C9D4DD" font-family="Segoe UI, sans-serif" font-size="12">/api/v1 and /mcp go to FastAPI. Everything else goes to Next.js. Compose file: docker-compose.prod.yml</text>
  <text x="480" y="338" text-anchor="middle" fill="#8FA0AD" font-family="Segoe UI, sans-serif" font-size="12">Live demo: 54.66.101.162  ·  project Region is ap-southeast-2 only</text>
</svg>
